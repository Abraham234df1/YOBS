name: 🤖 Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 💙 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter dependencies
        run: flutter pub get

      - name: 🔍 Analyze Dart code
        run: flutter analyze

      - name: 🔨 Build Android APK (Release)
        run: flutter build apk --release --split-per-abi

      - name: 🔨 Build Universal APK (Release)
        run: flutter build apk --release

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YOBS-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release (on tag or push to main)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0-latest' }}
          name: YOBS App Release ${{ github.ref_name }}
          body: |
            ## 📱 YOBS – Catálogo de Servicios Laborales

            | Plataforma | Estado | Descarga |
            |------------|--------|----------|
            | 🤖 Android | ✅ Disponible | `app-release.apk` (abajo) |
            | 🍎 iOS     | ✅ Disponible | Ver workflow `build-ios.yml` |

            ---

            ### 🤖 Instrucciones Android:
            1. Descarga `app-release.apk` desde los Assets de esta Release.
            2. En tu Android: **Ajustes → Seguridad → Fuentes desconocidas → Activar**.
            3. Abre el `.apk` descargado y toca **Instalar**.
            4. ¡Abre YOBS! 🎉

            ### 🍎 Instrucciones iOS:
            Consulta la [Release de iOS](../../releases) generada por el workflow `build-ios.yml` para descargar e instalar el IPA mediante **AltStore** o **Sideloadly**.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
